name: CI

on:
  push:
    branches: [main, dev, 'feature/*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SecureOverlay tests and compile verification
    runs-on: debian-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: https://github.com/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: https://github.com/android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Create compile-only local configuration
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'TELEGRAM_API_ID=1\n'
            printf 'TELEGRAM_API_HASH=00000000000000000000000000000000\n'
          } > local.properties

      - name: Run SecureOverlay JVM unit tests and compile verification
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :SecureOverlay:testDebugUnitTest \
            :SecureOverlay:compileDebugJavaWithJavac \
            :SecureOverlay:compileDebugAndroidTestJavaWithJavac \
            --no-daemon \
            --console=plain \
            "-Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Remove compile-only configuration
        if: always()
        run: rm -f local.properties
