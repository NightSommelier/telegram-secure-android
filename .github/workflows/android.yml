name: Android production APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    name: Compile fork and SecureOverlay tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and upstream submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --licenses < <(yes)
          "$sdkmanager" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Create compile-only local configuration
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            # These structurally valid placeholders are used only to compile untrusted PR code.
            printf 'TELEGRAM_API_ID=1\n'
            printf 'TELEGRAM_API_HASH=00000000000000000000000000000000\n'
          } > local.properties

      - name: Compile production sources and SecureOverlay test sources
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :SecureOverlay:compileDebugAndroidTestJavaWithJavac \
            :TMessagesProj:compileDebugJavaWithJavac \
            --no-daemon \
            --console=plain \
            "-Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Remove compile-only configuration
        if: always()
        run: rm -f local.properties

  package:
    name: Build signed production APK
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source and upstream submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --licenses < <(yes)
          "$sdkmanager" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Materialize protected build inputs
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${TELEGRAM_API_ID:?missing TELEGRAM_API_ID GitHub secret}"
          : "${TELEGRAM_API_HASH:?missing TELEGRAM_API_HASH GitHub secret}"
          : "${RELEASE_KEYSTORE_BASE64:?missing RELEASE_KEYSTORE_BASE64 GitHub secret}"
          : "${RELEASE_STORE_PASSWORD:?missing RELEASE_STORE_PASSWORD GitHub secret}"
          : "${RELEASE_KEY_ALIAS:?missing RELEASE_KEY_ALIAS GitHub secret}"
          : "${RELEASE_KEY_PASSWORD:?missing RELEASE_KEY_PASSWORD GitHub secret}"

          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'TELEGRAM_API_ID=%s\n' "$TELEGRAM_API_ID"
            printf 'TELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_HASH"
          } > local.properties
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.p12
          {
            printf 'RELEASE_STORE_FILE=keystore/release.p12\n'
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
          } > signing.properties

      - name: Build release APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            --no-daemon \
            --console=plain \
            -PLOCAL_MVP_ABI=arm64-v8a \
            "-Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/35.0.0/aapt2"
          apk=TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" >/dev/null
          version_name=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          mkdir -p dist/release
          cp "$apk" "dist/release/telegram-fork-secure-${version_name}.apk"
          sha256sum "dist/release/telegram-fork-secure-${version_name}.apk" \
            > "dist/release/telegram-fork-secure-${version_name}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-fork-secure-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* --title "Telegram Fork-Secure $tag" --generate-notes
          fi

      - name: Remove private build inputs
        if: always()
        run: rm -f local.properties signing.properties && rm -rf keystore
