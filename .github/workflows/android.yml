name: Android production APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    name: Compile fork and SecureOverlay tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and upstream submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --licenses < <(yes)
          "$sdkmanager" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Create compile-only local configuration
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            # These structurally valid placeholders are used only to compile untrusted PR code.
            printf 'TELEGRAM_API_ID=1\n'
            printf 'TELEGRAM_API_HASH=00000000000000000000000000000000\n'
          } > local.properties

      - name: Compile production sources and SecureOverlay test sources
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :SecureOverlay:compileDebugAndroidTestJavaWithJavac \
            :TMessagesProj:compileDebugJavaWithJavac \
            --no-daemon \
            --console=plain \
            "-Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Remove compile-only configuration
        if: always()
        run: rm -f local.properties

  package:
    name: Build signed production APK
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source and upstream submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --licenses < <(yes)
          "$sdkmanager" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Materialize protected build inputs
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${TELEGRAM_API_ID:?missing TELEGRAM_API_ID GitHub secret}"
          : "${TELEGRAM_API_HASH:?missing TELEGRAM_API_HASH GitHub secret}"
          : "${RELEASE_KEYSTORE_BASE64:?missing RELEASE_KEYSTORE_BASE64 GitHub secret}"
          : "${RELEASE_STORE_PASSWORD:?missing RELEASE_STORE_PASSWORD GitHub secret}"
          : "${RELEASE_KEY_ALIAS:?missing RELEASE_KEY_ALIAS GitHub secret}"
          : "${RELEASE_KEY_PASSWORD:?missing RELEASE_KEY_PASSWORD GitHub secret}"

          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'TELEGRAM_API_ID=%s\n' "$TELEGRAM_API_ID"
            printf 'TELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_HASH"
          } > local.properties
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.p12
          {
            printf 'RELEASE_STORE_FILE=keystore/release.p12\n'
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
          } > signing.properties

      - name: Build release APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          mkdir -p dist/release
          apk=TMessagesProj_App/build/outputs/apk/afat/release/app.apk

          build_apk() {
            local label="$1"
            local abi="${2:-}"
            local output="dist/release/telegram-fork-secure-${version_name}-${label}.apk"
            local gradle_args=(
              clean
              :TMessagesProj_App:assembleAfatRelease
              --no-daemon
              --console=plain
              "-Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/35.0.0/aapt2"
            )
            if [ -n "$abi" ]; then
              gradle_args+=("-PLOCAL_MVP_ABI=$abi")
            fi

            rm -f "$apk"
            ./gradlew "${gradle_args[@]}"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" >/dev/null
            cp "$apk" "$output"

            case "$label" in
              universal)
                for required_abi in armeabi-v7a arm64-v8a x86 x86_64; do
                  unzip -Z1 "$output" | grep -Eq "^lib/$required_abi/libtmessages\\.[0-9]+\\.so$"
                done
                ;;
              *)
                unzip -Z1 "$output" | grep -Eq "^lib/$abi/libtmessages\\.[0-9]+\\.so$"
                ;;
            esac
            sha256sum "$output" > "$output.sha256"
          }

          # Universal is the default Android APK; architecture-specific assets are smaller.
          build_apk universal
          build_apk arm64-v8a arm64-v8a
          build_apk armeabi-v7a armeabi-v7a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-fork-secure-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            cat > dist/release/RELEASE-NOTES.md <<EOF
          ## Fork-Secure $tag

          **Application version:** $(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          **Source commit:** ${GITHUB_SHA::12}

          ### Included APKs

          - universal: all supported Android ABIs; use this when unsure.
          - arm64-v8a: current 64-bit ARM phones.
          - armeabi-v7a: older 32-bit ARM phones.

          Every APK is signed with the project release key. A matching SHA-256 file is included for each APK.

          ### Changes in this build

          - Fork-Secure protected text and media functionality from the current fork state.
          - CI now verifies debug compilation without release credentials and builds signed release APKs from protected GitHub Secrets.
          - Multi-architecture release artifacts for Android devices.

          > This is a pre-release. The independent security review remains **CHANGES REQUIRED**; do not treat this build as a completed cryptographic audit.
          EOF
            gh release create "$tag" dist/release/*.apk dist/release/*.sha256 \
              --title "Telegram Fork-Secure $tag" \
              --notes-file dist/release/RELEASE-NOTES.md \
              --prerelease
          fi

      - name: Remove private build inputs
        if: always()
        run: rm -f local.properties signing.properties && rm -rf keystore
